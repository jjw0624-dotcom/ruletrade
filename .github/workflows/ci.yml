name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Repository validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.11"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Verify uv and install Python
        run: |
          uv --version
          uv python install 3.12
          uv run python --version
      - name: Install Python dependencies
        run: uv sync --extra bt --extra dev --locked
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify Node and install frontend dependencies
        run: |
          node --version
          npm --version
          npm --prefix frontend ci --no-audit --no-fund
      - name: Run full repository validation
        run: make check

  lean-compile:
    name: Generated C# / LEAN compile
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.11"
          enable-cache: false
      - name: Verify uv and install Python
        run: |
          uv --version
          uv python install 3.12
          uv run python --version
      - name: Install compiler dependencies
        run: uv sync --extra dev --locked
      - name: Generate compiler-slice C# algorithms
        run: make check-lean-generate
      - name: Free space for the LEAN Docker image
        run: |
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /usr/share/dotnet \
            /opt/ghc \
            /opt/hostedtoolcache
          rm -rf .venv
          docker system prune --all --force
          df -h /
      - name: Compile generated C# against LEAN
        run: ./scripts/check_lean.sh --compile-only
      - name: Upload LEAN compile diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: lean-compile-diagnostics-${{ github.run_id }}
          path: build/lean/*-ci/
          if-no-files-found: ignore
          retention-days: 7
