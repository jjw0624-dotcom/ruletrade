name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra bt --extra dev --locked

      - name: Run tests
        run: uv run pytest

      - name: Lint Python
        run: >-
          uv run ruff check
          src/ruletrade/api.py
          src/ruletrade/backtests
          scripts/run_editor_lean_e2e.py
          scripts/run_lean_backtest.py
          tests/test_api.py
          tests/test_lean_backtest_service.py

      - name: Compile Python
        run: uv run python -m compileall -q src scripts tests

      - name: Check shell syntax
        run: bash -n scripts/run_golden_lean_e2e.sh scripts/build_golden_lean_docker.sh

      - name: Check patch whitespace
        run: git diff --check

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Build frontend
        working-directory: frontend
        run: npm run build
