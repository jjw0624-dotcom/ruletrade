name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feature/semantic-strategy-corpus-execution-closure]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Repository validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.11"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Verify uv and install Python
        run: |
          uv --version
          uv python install 3.12
          uv lock --check
          uv run --locked python --version
      - name: Install Python dependencies
        run: uv sync --extra bt --extra dev --locked
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify Node and install frontend dependencies
        run: |
          node --version
          npm --version
          npm --prefix frontend ci --no-audit --no-fund
      - name: Run full repository validation
        run: make check

  lean-compile:
    name: Generated C# / LEAN compile
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.11"
          enable-cache: false
      - name: Verify uv and install Python
        run: |
          uv --version
          uv python install 3.12
          uv lock --check
          uv run --locked python --version
      - name: Install compiler dependencies
        run: uv sync --extra dev --locked
      - name: Generate compiler-slice C# algorithms
        run: make check-lean-generate
      - name: Free space for the LEAN Docker image
        run: |
          # Keep the Python/uv environment alive: the following real Docker
          # differential is part of this same job, not a compile-only afterthought.
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /usr/share/dotnet \
            /opt/ghc
          docker system prune --all --force
          df -h /
      - name: Compile generated C# against LEAN
        run: ./scripts/check_lean.sh --compile-only
      - name: Run Profile A Work 2 DailyValue LEAN differentials
        run: make check-lean-daily-values
      - name: Run SemanticProgramV2 corpus LEAN differential
        run: make check-lean-semantic-corpus
      - name: Run weighted Score / Allocation LEAN differential
        run: make check-lean-weighted-score
      - name: Run temporal and stateful LEAN differential
        run: make check-lean-temporal-stateful
      - name: Run temporal fresh-process restart differential
        run: make check-lean-temporal-reliability
      - name: Run completed weekly to daily LEAN differential
        run: make check-lean-temporal-multiclock
      - name: Run composable semantic execution LEAN differential
        run: make check-lean-composable-semantic
      - name: Run composable fresh-process restart differential
        run: make check-lean-composable-restart
      - name: Upload LEAN compile diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: lean-compile-diagnostics-${{ github.run_id }}
          path: build/lean/*-ci/
          if-no-files-found: ignore
          retention-days: 7
