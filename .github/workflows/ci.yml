# V2 engine regression closure intentionally exercises the complete capability matrix.
# Workflow changes intentionally force the full matrix through Impact Classification.
name: Capability CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capability-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Impact Classification
    runs-on: ubuntu-latest
    outputs:
      lean: ${{ steps.impact.outputs.lean }}
      docker: ${{ steps.impact.outputs.docker }}
      api: ${{ steps.impact.outputs.api }}
      browser: ${{ steps.impact.outputs.browser }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - id: impact
        name: Classify affected capability domains
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          lean=false
          docker=false
          api=false
          browser=false
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            lean=true; docker=true; api=true; browser=true
          else
            git diff --name-only "$BASE_SHA"...HEAD > "$RUNNER_TEMP/changed-files.txt"
            while IFS= read -r path; do
              case "$path" in
                docs/*|*.md) ;;
                frontend/*)
                  browser=true
                  ;;
                .github/workflows/*|Makefile|uv.lock|pyproject.toml|.python-version|.node-version)
                  lean=true; docker=true; api=true; browser=true
                  ;;
                src/*|scripts/*|tests/*|corpus/*|examples/*|data/*)
                  lean=true; docker=true; api=true
                  [[ "$path" == scripts/check_builder_browser.mjs ]] && browser=true
                  ;;
                *)
                  # Unknown shared files are conservative: prove every capability.
                  lean=true; docker=true; api=true; browser=true
                  ;;
              esac
            done < "$RUNNER_TEMP/changed-files.txt"
          fi
          echo "lean=$lean" >> "$GITHUB_OUTPUT"
          echo "docker=$docker" >> "$GITHUB_OUTPUT"
          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "browser=$browser" >> "$GITHUB_OUTPUT"

  static-contract:
    name: Static & Contract
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.11"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: |
          uv python install 3.12
          uv lock --check
          uv sync --extra bt --extra dev --locked
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci --no-audit --no-fund
      - name: Validate capability evidence
        run: make check-capability-evidence
      - name: Generate bootstrap contracts
        run: npm --prefix frontend run generate:bootstrap
      - name: TypeScript and production build
        run: |
          npm --prefix frontend run typecheck:raw
          npm --prefix frontend run build:raw
      - name: Python, shell and generated-artifact contracts
        run: |
          ./scripts/check_ruff.sh
          uv run python -m compileall -q src scripts tests
          while IFS= read -r -d '' script; do bash -n "$script"; done < <(find scripts -type f -name '*.sh' -print0)
          git diff --check
          git diff --exit-code -- \
            frontend/src/test/generated-bootstrap.json \
            frontend/src/test/generated-momentum-bootstrap.json \
            frontend/src/test/generated-sleeves-bootstrap.json \
            frontend/src/test/generated-cooldown-bootstrap.json

  unit-semantic:
    name: Unit & Semantic
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.11"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: |
          uv python install 3.12
          uv sync --extra bt --extra dev --locked
          uv run pytest
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: |
          npm --prefix frontend ci --no-audit --no-fund
          npm --prefix frontend run test:raw

  lean-compilation:
    name: LEAN Compilation
    needs: changes
    if: needs.changes.outputs.lean == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.11"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: |
          uv python install 3.12
          uv sync --extra dev --locked
          make check-lean-generate
      - name: Free space for LEAN image
        run: |
          sudo rm -rf /usr/local/lib/android /usr/local/share/boost /usr/share/dotnet /opt/ghc
          docker system prune --all --force
      - name: Compile generated C# against LEAN
        run: ./scripts/check_lean.sh --compile-only
      - name: Upload compile diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: lean-compile-${{ github.run_id }}
          path: build/lean/*-ci/
          if-no-files-found: ignore
          retention-days: 7

  docker-differential:
    name: Docker Differential / ${{ matrix.profile }}
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - profile: core-selection
            targets: |
              make check-lean-daily-values
              make check-lean-semantic-corpus
              make check-lean-static-program
          - profile: score-composable
            targets: |
              make check-lean-weighted-score
              make check-lean-composable-semantic
              make check-lean-composable-restart
          - profile: temporal-replay
            targets: |
              make check-lean-temporal-stateful
              make check-lean-temporal-reliability
              make check-lean-temporal-multiclock
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.11"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: |
          uv python install 3.12
          uv sync --extra dev --locked
      - name: Free space for LEAN image
        run: |
          sudo rm -rf /usr/local/lib/android /usr/local/share/boost /usr/share/dotnet /opt/ghc
          docker system prune --all --force
      - run: ${{ matrix.targets }}
      - name: Upload differential diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: differential-${{ matrix.profile }}-${{ github.run_id }}
          path: build/lean/
          if-no-files-found: ignore
          retention-days: 14

  production-api-contract:
    name: Production API Contract
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.11"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: |
          uv python install 3.12
          uv sync --extra bt --extra dev --locked
      - name: Free space for persisted V2 Docker API proof
        run: |
          sudo rm -rf /usr/local/lib/android /usr/local/share/boost /usr/share/dotnet /opt/ghc
          docker system prune --all --force
      - name: Verify saved V2 Revision through Docker LEAN and persisted API
        run: make check-lean-persisted-v2-api

  browser-e2e:
    name: Real Browser E2E
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci --no-audit --no-fund
      - run: google-chrome --version
      - name: Run production Builder in real Chrome
        run: node scripts/check_builder_browser.mjs
      - name: Upload screenshots and trace
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: browser-e2e-${{ github.run_id }}
          path: build/browser-acceptance/
          if-no-files-found: warn
          retention-days: 14

  required:
    name: Capability CI Required
    if: always()
    needs: [changes, static-contract, unit-semantic, lean-compilation, docker-differential, production-api-contract, browser-e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Require every expected capability contract
        env:
          CHANGES: ${{ needs.changes.result }}
          STATIC: ${{ needs.static-contract.result }}
          UNIT: ${{ needs.unit-semantic.result }}
          LEAN_EXPECTED: ${{ needs.changes.outputs.lean }}
          LEAN: ${{ needs.lean-compilation.result }}
          DOCKER_EXPECTED: ${{ needs.changes.outputs.docker }}
          DOCKER: ${{ needs.docker-differential.result }}
          API_EXPECTED: ${{ needs.changes.outputs.api }}
          API: ${{ needs.production-api-contract.result }}
          BROWSER_EXPECTED: ${{ needs.changes.outputs.browser }}
          BROWSER: ${{ needs.browser-e2e.result }}
        run: |
          set -euo pipefail
          test "$CHANGES $STATIC $UNIT" = "success success success"
          require_expected() {
            local expected="$1" result="$2" label="$3"
            if [[ "$expected" == "true" ]]; then
              test "$result" = "success" || { echo "$label required but result was $result"; return 1; }
            else
              test "$result" = "skipped" || { echo "$label intentionally unaffected but result was $result"; return 1; }
            fi
          }
          require_expected "$LEAN_EXPECTED" "$LEAN" LEAN
          require_expected "$DOCKER_EXPECTED" "$DOCKER" Docker
          require_expected "$API_EXPECTED" "$API" API
          require_expected "$BROWSER_EXPECTED" "$BROWSER" Browser
