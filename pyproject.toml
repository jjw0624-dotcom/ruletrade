[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ruletrade-mvp"
version = "0.1.0"
description = "A minimal vertical slice for RuleTrade: simple strategy -> bt -> normalized API result."
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "numpy>=2.0,<3",
  "pandas>=2.2,<4",
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
bt = ["bt==1.2.3"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
ruletrade = "ruletrade.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
